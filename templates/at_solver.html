<!--ВЕРСИЯ РАБОТАЮЩАЯ-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT Solver Results</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet"/>
    <script src="/static/bootstrap.min.js"></script>
    <style>
        body {
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #fetchResults {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #fetchResults:hover {
            background-color: #0056b3;
        }
        .my_btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .my_btn:hover {
            background-color: #0056b3;
        }
        button {
            display: inline-flex;
            align-items: center;
            margin: 10px 0;
            padding: 5px 10px;
            font-size: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button svg {
            margin-left: 8px;
            transition: transform 0.2s;
        }
        button.expand svg {
            transform: rotate(90deg);
        }
        .my_content h3 {
            text-align: center;
            background-color: #007BFF;
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 1.75rem;  /* чуть больше чем h4 */
            font-weight: 600;    /* полужирный */
        }
        .my_content h4 {
            margin: 10px 0 5px;
        }
        .my_h4 {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .my_container {
            width: 100%; /* Используем всю доступную ширину */
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .my_grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px; /* Немного уменьшил промежутки между колонками */
            padding: 10px 0;
        }
        .my_section {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            background: #FFFFFF; /* Белый цвет для секций */
        }
        .my_section h2 {
            font-size: 18px;
            margin: 0;
            padding: 10px 15px;
            background-color: #e6e6e6; /* Светло-серый цвет для заголовка */
            color: black; /* Цвет текста заголовка */
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .my_goal-section {
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            background: #f9f9f9;
        }
        .goal-section h3 {
            font-size: 16px;
            margin: 0 0 10px;
        }
        .goal-section pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .my_content {
            padding: 15px;
            display: none;
        }
        .my_content pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        /* Новый стиль для прогресс-бара */
        #progressBarContainer {
            display: none; /* Скрыт по умолчанию */
            width: 30%;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px auto;
        }
        #progressBar {
            width: 0%;
            height: 20px;
            background-color: #007BFF;
            transition: width 0.3s ease;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #f8f9fa !important;
            color: #343a40 !important;
        }
        header a {
            color: #343a40 !important;
        }
        header a:hover {
            text-decoration: underline;
        }
        .my_btn, button {
            font-size: 14px;
        }
        .title-main {
            text-align: center;
            font-size: 1.75rem;  /* чуть больше чем h4 */
            font-weight: 600;    /* полужирный */
            color: #212529;      /* стандартный Bootstrap текст */
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .no-bootstrap * {
            all: revert;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        /* Дальше свои стили для конкретных элементов */
        .no-bootstrap h3 {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        h2.no-bootstrap {
            /* all: initial; */
            font-size: 18px;
            margin: 0;
            padding: 10px 15px;
            background-color: #e6e6e6; /* Светло-серый цвет для заголовка */
            color: black; /* Цвет текста заголовка */
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .no-bootstrap table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .no-bootstrap th, .no-bootstrap td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .no-bootstrap button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .no-bootstrap button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Верхняя часть (Header) -->
        <header class="py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <h1>AT-AGENTS</h1>
                <nav>
                    <a href="/" class="me-3">Главная</a>
                    <a href="/about" class="me-3">О нас</a>
                    <a href="/contact">Контакты</a>
                </nav>
            </div>
        </header>

    <h1 class="title-main">Совместное функционирование базовых компонентов архитектуры интеллектуального агента</h1>
    <button id="fetchResults">Запустить совместное функционирование</button>

    <!-- Прогресс-бар -->
    <div id="progressBarContainer"> <!-- Добавлено -->
        <div id="progressBar"></div> <!-- Добавлено -->
    </div>

    <div class="my_container">
        <a href="/todoOutput" class="my_btn">Назад</a>
        <div id="resultsContainer">
            <!-- Секции с результатами будут добавляться сюда -->
        </div>
    </div>

    <script>
        const fetchResultsButton = document.getElementById('fetchResults');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBar = document.getElementById('progressBar');
        const resultsContainer = document.getElementById('resultsContainer');

        fetchResultsButton.addEventListener('click', async () => {
            try {
                // Показать прогресс-бар
                progressBarContainer.style.display = 'block';
                progressBar.style.width = '0%';

                const response = await fetch('/api/results');

                // Имитация прогресса загрузки
                for (let i = 0; i <= 100; i += 20) {
                    progressBar.style.width = `${i}%`;
                    await new Promise(resolve => setTimeout(resolve, 200));
                }

                if (response.ok) {
                    const results = await response.json();

                    resultsContainer.innerHTML = ""; // Очистить перед обновлением

                    if (Array.isArray(results)) {
                        results.forEach((result, index) => {
                            const section = document.createElement('div');
                            console.log("solver_result:", result.solver_result);

                            section.className = 'my_section';

                            const header = document.createElement('h2');
                            header.className = 'no-bootstrap';
                            header.innerHTML = `Такт ${index + 1} <button><span>Развернуть</span><svg width="10" height="10" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white"><path d="M8.59 16.59L13.17 12L8.59 7.41L10 6l6 6l-6 6z"/></svg></button>`;
                            section.appendChild(header);

                            const content = document.createElement('div');
                            content.className = 'my_content';

                            // Создаем сетку из трёх колонок
                            const gridContainer = document.createElement('div');
                            gridContainer.style.display = 'grid';
                            gridContainer.style.gridTemplateColumns = '1fr 1fr 1fr';
                            gridContainer.style.gap = '20px';

                            // Колонка 1: solver_result
                            const solverCol = document.createElement('div');
                            const solverTitle = document.createElement('h3');
                            solverTitle.textContent = 'АТ-РЕШАТЕЛЬ';
                            solverCol.appendChild(solverTitle);

                            const steps = result.solver_result?.trace?.steps || [];

                            steps.forEach((step, stepIndex) => {
                                const stepBlock = document.createElement('div');
                                stepBlock.className = 'no-bootstrap';
                                stepBlock.style.marginBottom = '20px';

                                const stepHeader = document.createElement('h4');
                                stepHeader.className = 'my_h4';
                                stepHeader.textContent = `Шаг ${stepIndex + 1}`;
                                stepBlock.appendChild(stepHeader);

                                // Конфликтные правила
                                if (step.conflict_rules && Array.isArray(step.conflict_rules) && step.conflict_rules.length > 0) {
                                    const conflictBox = document.createElement('div');
                                    conflictBox.className = 'no-bootstrap';
                                    conflictBox.style.border = '1px solid #b3e6b3';
                                    conflictBox.style.padding = '10px';
                                    conflictBox.style.marginBottom = '10px';
                                    conflictBox.style.borderRadius = '5px';
                                    conflictBox.style.backgroundColor = '#e6ffe6';

                                    const conflictTitle = document.createElement('h4');
                                    conflictTitle.textContent = 'Выбранные правила';
                                    conflictBox.appendChild(conflictTitle);

                                    const conflictList = document.createElement('ul');
                                    step.conflict_rules.forEach(rule => {
                                        const li = document.createElement('li');
                                        li.textContent = rule;
                                        conflictList.appendChild(li);
                                    });
                                    conflictBox.appendChild(conflictList);
                                    stepBlock.appendChild(conflictBox);
                                }

                                // Таблицы ресурсов из final_wm_state
                                if (step.final_wm_state && typeof step.final_wm_state === 'object') {
                                    const resourceMap = {};

                                    // Группировка по ресурсу
                                    Object.entries(step.final_wm_state).forEach(([key, value]) => {
                                        const [resource, attribute] = key.split('.');
                                        if (!resourceMap[resource]) {
                                            resourceMap[resource] = [];
                                        }
                                        resourceMap[resource].push({ attribute, value });
                                    });

                                    // Отображение таблиц
                                    Object.entries(resourceMap).forEach(([resource, attrs]) => {
                                        const tableTitle = document.createElement('h4');
                                        tableTitle.textContent = resource;
                                        stepBlock.appendChild(tableTitle);

                                        const table = document.createElement('table');
                                        table.className = 'no-bootstrap';
                                        table.style.width = '100%';
                                        table.style.borderCollapse = 'collapse';
                                        table.style.marginBottom = '15px';

                                        const thead = document.createElement('thead');
                                        const headRow = document.createElement('tr');

                                        ['Атрибут', 'Значение'].forEach(text => {
                                            const th = document.createElement('th');
                                            th.textContent = text;
                                            th.style.border = '1px solid #ccc';
                                            th.style.padding = '5px';
                                            th.style.backgroundColor = '#f0f0f0';
                                            headRow.appendChild(th);
                                        });

                                        thead.appendChild(headRow);
                                        table.appendChild(thead);

                                        const tbody = document.createElement('tbody');

                                        attrs.forEach(({ attribute, value }) => {
                                            const row = document.createElement('tr');

                                            const attrCell = document.createElement('td');
                                            attrCell.textContent = attribute;
                                            attrCell.style.border = '1px solid #ccc';
                                            attrCell.style.padding = '5px';

                                            const valCell = document.createElement('td');
                                            valCell.style.border = '1px solid #ccc';
                                            valCell.style.padding = '5px';
                                            valCell.style.textAlign = 'center'; // Центрирование по горизонтали

                                            const button = document.createElement('button');

                                            button.addEventListener('click', () => {
                                                if (value.non_factor) {
                                                    alert(
                                                        `Атрибут: ${attribute}\n` +
                                                        `Accuracy: ${value.non_factor.accuracy}\n` +
                                                        `Belief: ${value.non_factor.belief}\n` +
                                                        `Probability: ${value.non_factor.probability}`
                                                    );
                                                } else {
                                                    alert(`Атрибут: ${attribute}\nНет информации о non_factor`);
                                                }
                                            });

                                            button.textContent = value?.content ?? '—';
                                            valCell.appendChild(button);

                                            row.appendChild(attrCell);
                                            row.appendChild(valCell);
                                            tbody.appendChild(row);
                                        });

                                        table.appendChild(tbody);
                                        stepBlock.appendChild(table);
                                    });
                                }

                                solverCol.appendChild(stepBlock);
                            });

                            // Колонка 2: Темпоральный решатель
                            const attCol = document.createElement('div');
                            const attTitle = document.createElement('h3');
                            attTitle.textContent = 'Темпоральный решатель';
                            attCol.appendChild(attTitle);

                            const signified = result.temporal_result?.signified || {};
                            const signifiedMeta = result.temporal_result?.signified_meta || {};
                            const timeline = result.temporal_result?.timeline?.tacts || [];

                             // Колонка: Signified
                            if (Object.keys(signified).length > 0) {
                                const signifiedCol = document.createElement('div');
                                signifiedCol.className = 'no-bootstrap';
                                const signifiedTitle = document.createElement('h3');
                                signifiedTitle.textContent = 'Signified';
                                signifiedTitle.className = 'no-bootstrap';
                                // signifiedCol.appendChild(signifiedTitle);

                                const resourceMap = {};

                                Object.entries(signified).forEach(([key, value]) => {
                                    if (!key.startsWith('knowledge') && value !== null && key.includes('.')) {
                                        const [resource, attribute] = key.split('.');
                                        if (!resourceMap[resource]) {
                                            resourceMap[resource] = [];
                                        }
                                        resourceMap[resource].push({ attribute, value });
                                    }
                                });

                                Object.entries(resourceMap).forEach(([resource, attrs]) => {
                                    const tableTitle = document.createElement('h4');
                                    tableTitle.textContent = resource;
                                    signifiedCol.appendChild(tableTitle);

                                    const table = document.createElement('table');
                                    table.className = 'no-bootstrap';
                                    table.style.width = '100%';
                                    table.style.borderCollapse = 'collapse';
                                    table.style.marginBottom = '15px';

                                    const thead = document.createElement('thead');
                                    const headRow = document.createElement('tr');

                                    ['Атрибут', 'Значение'].forEach(text => {
                                        const th = document.createElement('th');
                                        th.textContent = text;
                                        th.style.border = '1px solid #ccc';
                                        th.style.padding = '5px';
                                        th.style.backgroundColor = '#f0f0f0';
                                        headRow.appendChild(th);
                                    });

                                    thead.appendChild(headRow);
                                    table.appendChild(thead);

                                    const tbody = document.createElement('tbody');

                                    attrs.forEach(({ attribute, value }) => {
                                        const row = document.createElement('tr');

                                        const attrCell = document.createElement('td');
                                        attrCell.textContent = attribute;
                                        attrCell.style.border = '1px solid #ccc';
                                        attrCell.style.padding = '5px';

                                        const valCell = document.createElement('td');
                                        valCell.style.border = '1px solid #ccc';
                                        valCell.style.padding = '5px';
                                        valCell.style.textAlign = 'center';

                                        const button = document.createElement('button');
                                        button.textContent = String(value);
                                        button.addEventListener('click', () => {
                                            alert(`Атрибут: ${attribute}\nНет информации о non_factor`);
                                        });

                                        valCell.appendChild(button);
                                        row.appendChild(attrCell);
                                        row.appendChild(valCell);
                                        tbody.appendChild(row);
                                    });

                                    table.appendChild(tbody);
                                    signifiedCol.appendChild(table);
                                });

                                attCol.appendChild(signifiedCol);
                            }

                            // Блок Signified Meta
                            if (Object.keys(signified).length > 0) {
                                const metaBlock = document.createElement('div');
                                metaBlock.style.marginBottom = '20px';

                                const metaHeader = document.createElement('h4');
                                metaHeader.textContent = 'Signified Meta';
                                metaBlock.appendChild(metaHeader);

                                const knowledgeList = document.createElement('ul');

                                Object.entries(signified).forEach(([key, value]) => {
                                    if (key.startsWith('knowledge') && value === null) {
                                        // Парсим текст по шаблону
                                        const ruleMatch = key.match(/rule\[(\d+)\]/);
                                        const ruleNumber = ruleMatch ? ruleMatch[1] : 'неизвестно';

                                        const li = document.createElement('li');
                                        li.textContent = `${key}: правило: ${extractRuleName(key)}, операция: ${extractOperation(key)}, значение: null`;
                                        knowledgeList.appendChild(li);
                                    }
                                });

                                if (knowledgeList.children.length > 0) {
                                    metaBlock.appendChild(knowledgeList);
                                    attCol.appendChild(metaBlock);
                                }
                            }

                            // Блок Таймлайн
                            if (timeline.length > 0) {
                                timeline.forEach((tick, index) => {
                                    const tickBlock = document.createElement('div');
                                    tickBlock.style.marginBottom = '20px';

                                    const tickHeader = document.createElement('h4');
                                    tickHeader.textContent = `Тактовый шаг ${tick.tact}`;
                                    tickBlock.appendChild(tickHeader);

                                    // События
                                    if (tick.events?.length > 0) {
                                        const eventsBox = document.createElement('div');
                                        eventsBox.style.border = '1px solid #b3e6ff';
                                        eventsBox.style.padding = '10px';
                                        eventsBox.style.marginBottom = '10px';
                                        eventsBox.style.borderRadius = '5px';
                                        eventsBox.style.backgroundColor = '#e6f7ff';

                                        const eventsTitle = document.createElement('h4');
                                        eventsTitle.textContent = 'События';
                                        eventsBox.appendChild(eventsTitle);

                                        const eventList = document.createElement('ul');
                                        tick.events.forEach(eventObj => {
                                            const evLi = document.createElement('li');
                                            evLi.textContent = `→ ${eventObj.event} (tact: ${eventObj.occurance_tact})`;
                                            eventList.appendChild(evLi);
                                        });

                                        eventsBox.appendChild(eventList);
                                        tickBlock.appendChild(eventsBox);
                                    }

                                    // Открытые интервалы
                                    if (tick.opened_intervals?.length > 0) {
                                        const intervalsBox = document.createElement('div');
                                        intervalsBox.style.border = '1px solid #ffd699';
                                        intervalsBox.style.padding = '10px';
                                        intervalsBox.style.marginBottom = '10px';
                                        intervalsBox.style.borderRadius = '5px';
                                        intervalsBox.style.backgroundColor = '#fff3e6';

                                        const intervalsTitle = document.createElement('h4');
                                        intervalsTitle.textContent = 'Открытые интервалы';
                                        intervalsBox.appendChild(intervalsTitle);

                                        const intList = document.createElement('ul');
                                        tick.opened_intervals.forEach(interval => {
                                            const close = interval.close_tact ?? 'ещё открыт';
                                            const intLi = document.createElement('li');
                                            intLi.textContent = `→ ${interval.interval} [от ${interval.open_tact} до ${close}]`;
                                            intList.appendChild(intLi);
                                        });

                                        intervalsBox.appendChild(intList);
                                        tickBlock.appendChild(intervalsBox);
                                    }

                                    attCol.appendChild(tickBlock);
                                });
                            }

                            // Колонка 3: Планировщик (goal + serialized_plan)
                            const plannerCol = document.createElement('div');
                            const plannerTitle = document.createElement('h3');
                            plannerTitle.textContent = 'Планировщик';
                            plannerCol.appendChild(plannerTitle);

                            if (Array.isArray(result.goal)) {
                                result.goal.forEach((goal, goalIndex) => {
                                    const goalDiv = document.createElement('div');
                                    goalDiv.className = 'my_goal-section';

                                    const goalHeader = document.createElement('h4');
                                    goalHeader.textContent = `Цель ${goalIndex + 1}`;
                                    goalDiv.appendChild(goalHeader);

                                    const goalPre = document.createElement('pre');
                                    goalPre.textContent = JSON.stringify(goal, null, 2);
                                    goalDiv.appendChild(goalPre);

                                    const planHeader = document.createElement('h4');
                                    planHeader.textContent = 'План';
                                    goalDiv.appendChild(planHeader);

                                    const planContent = document.createElement('div');
                                    if (Array.isArray(result.serialized_plan[goalIndex])) {
                                        planContent.innerHTML = result.serialized_plan[goalIndex].join('<br>');
                                    } else {
                                        planContent.innerHTML = result.serialized_plan[goalIndex]?.replace(/\n/g, '<br>') ?? '';
                                    }
                                    goalDiv.appendChild(planContent);

                                    plannerCol.appendChild(goalDiv);
                                });
                            }

                            // Добавляем колонки в сетку
                            gridContainer.appendChild(attCol);
                            gridContainer.appendChild(solverCol);
                            // gridContainer.appendChild(plannerCol);

                            // Добавляем сетку в content
                            content.appendChild(gridContainer);

                            section.appendChild(content);
                            header.addEventListener('click', () => toggleContent(content, header));
                            resultsContainer.appendChild(section);
                        });
                    } else {
                        resultsContainer.innerHTML = `<div class="my_section"><h2>Ошибка</h2><pre>Ожидался массив тактов, но получено: ${JSON.stringify(results)}</pre></div>`;
                    }
                } else {
                    showError("Результаты пока недоступны.");
                }
            } catch (error) {
                console.error(error);
                showError("Ошибка при получении результатов.");
            } finally {
                // Скрыть прогресс-бар после завершения
                progressBarContainer.style.display = 'none';
            }
        });

        function toggleContent(content, header) {
            const button = header.querySelector('button');
            content.style.display = content.style.display === 'none' || !content.style.display ? 'block' : 'none';
            button.classList.toggle('expand');
            button.querySelector('span').textContent = content.style.display === 'block' ? 'Свернуть' : 'Развернуть';
        }

        function showError(message) {
            resultsContainer.innerHTML = `<div class="my_section"><h2>Ошибка</h2><pre>${message}</pre></div>`;
        }
    </script>
    <!-- Подвал (Footer) -->
    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 AT-AGENTS. Все права защищены.</p>
        </div>
    </footer>
    </div>
</body>
</html>
